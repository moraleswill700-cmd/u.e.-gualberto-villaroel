<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno Digital - Mis Apuntes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-institucional sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <img src="img/logo.jpg.jpeg" alt="Logo Escudo" width="35" height="42" class="d-inline-block align-text-top">
                <span>Cuaderno Digital</span>
            </a>
            
            <div class="d-flex align-items-center gap-3">
                <span class="text-white small d-none d-sm-inline" id="userEmail"><i class="bi bi-person-circle me-1"></i> Cargando...</span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container my-4">
        
        <div class="row g-3 mb-4 align-items-center">
            <div class="col-12 col-md-4">
                <button class="btn btn-success w-100 py-2.5 fw-semibold shadow-sm rounded-3" data-bs-toggle="modal" data-bs-target="#modalApunte">
                    <i class="bi bi-plus-circle me-2"></i>Nuevo Apunte
                </button>
            </div>
            
            <div class="col-12 col-md-8">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white"><i class="bi bi-filter-square text-muted"></i></span>
                    <select class="form-select border-start-0" id="filtroMateria">
                        <option value="todas">Todas las materias</option>
                        <option value="matematicas">Matemáticas</option>
    <option value="lenguaje">Lenguaje</option>
    <option value="quimica">Química</option>
    <option value="fisica">Física</option>
    <option value="biologia">Biología</option>
    <option value="ciencias sociales">Ciencias Sociales</option>
    <option value="ingles">Inglés</option>
    <option value="artes plasticas">Artes Plásticas</option>
    <option value="filosofia">Filosofía</option>
    <option value="religion">Religión</option>
    <option value="educacion fisica">Educación Física</option>
    <option value="informatica">Informática</option>

                    </select>
                </div>
            </div>
        </div>

        <!-- Contenedor dinámico donde Firebase renderiza las tarjetas -->
        <div class="row g-3" id="contenedorApuntes">
        </div>
    </div>

    <!-- Modal para Agregar Apunte -->
    <div class="modal fade" id="modalApunte" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-institucional text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-journal-plus me-2"></i>Guardar Nuevo Apunte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formApunte">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Materia</label>
                                <select class="form-select" id="materia" required>
                                    <option value="" selected disabled>Selecciona una materia...</option>
                                    <option value="matematicas">Matemáticas</option>
                                    <option value="lenguaje">Lenguaje y Comunicación</option>
                                    <option value="ciencias">Ciencias Naturales</option>
                                    <option value="historia">Historia y Sociales</option>
                                </select>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Título del Apunte</label>
                                <input type="text" class="form-control" id="titulo" placeholder="Ej: Tema 2 - Álgebra" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Notas o resumen escrito</label>
                                <textarea class="form-control" id="contenido" rows="4" placeholder="Escribe aquí tus apuntes principales..."></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold"><i class="bi bi-camera me-1"></i> Adjuntar Foto o PDF</label>
                                <input class="form-control" type="file" id="archivo" accept="image/*,.pdf">
                                <div class="form-text">Puedes subir una foto tomada con la cámara del celular o un archivo PDF.</div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-secondary me-2 rounded-3" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-institucional px-4 shadow-sm"><i class="bi bi-cloud-upload me-1"></i> Guardar en la Nube</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
